# format is:
# check = filename : variable1(precision) variable2(precision) ...
#
# (default precision is 1e-6)
#
# If you omit any vaiables, then it will just check
# if the file has been generated.
#
# You can define more than one check
#
# examples:

inputfile = transchar.tib
outputdir = output_transchar

check = sweep_gate_driftdiffusion.dat : $Vg backcontact.current drain.current gate.current source.current
