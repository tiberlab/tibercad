# the checks to perform:

# format is:
# check = filename : variable1(precision) variable2(precision) ...
#
# (default precision is 1e-6)
#
# If you omit any vaiables, then it will just check
# if the file has been generated.
#
# You can define more than one check
#
# examples:

inputfile = qdisk.tib
outputdir = output

check = dd_msh.vtu : Ec Ev
check = strain_msh.vtu : Strain Stress
check = quantum_el.dat : EigenEnergy
check = quantum_hl.dat : EigenEnergy
check = optics_spectrum_k_0.dat : spontaneous_power_density_Px[W/eV] spontaneous_power_density_Py[W/eV] spontaneous_power_density_Pz[W/eV]
