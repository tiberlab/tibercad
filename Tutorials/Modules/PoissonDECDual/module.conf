Module poisson
{
  # install here (default is in the tibercad installation's
  # module directory
  installpath = .

  # the sources for the main module library (the first one provides
  # the creatable object)
  sources = (Poisson.C, PoissonModel.C, PoissonBoundaryModel.C)

  charge_density { sources = models/ChargeDensity.C }

  # 'contact' is the keyword used to build the library.
  # (It does not appear in the input file)
  contact dirichlet { sources = models/PoissonDirichlet.C }
  contact neumann   { sources = models/PoissonNeumann.C }

}

