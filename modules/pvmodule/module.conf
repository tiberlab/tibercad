Module pvmodule
{
  # install here (default is in the tibercad installation's
  # module directory
  #installpath = .

  # the sources for the main module library (the first one provides
  # the creatable object)
  sources = (PVModule.cpp, PVModuleModel.cpp, PVModuleBoundaryModel.cpp, ElementaryCell.cpp)

  elementary_cell pwl { sources = models/ElementaryPWL.cpp }
  elementary_cell equiv_1diode { sources = models/Elementary1Diode.cpp }

  degradation humidity { sources = models/DegradationH2O.cpp }
  photocurrent H2O_dependent { sources = models/PCDegradationH2O.cpp }

  # 'contact' is the keyword used to build the library.
  # (It does not appear in the input file)
#  contact { sources = models/VoltageControl.cpp }

}

