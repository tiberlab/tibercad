Compiler
{

  #path = (@ROOT/SDK/@ARCH/bin, @ROOT/SDK/bin)
  path = @ROOT/SDK/bin

  linker_flags = "-pthread -shared -Wl,-rpath,'$ORIGIN' -Wl,-rpath,'$ORIGIN/../lib'"

  C++
  {
    executable = "mpicxx -v -cxx=@ROOT/SDK/@ARCH/bin/g++"
    compiler_flags = "-g -O3 -std=gnu++0x -pthread -fPIC -c -I/usr/include/x86_64-linux-gnu"
    # -fvisibility=hidden
  }

  C
  {
    executable = mpicc
  }

  Fortran
  {
    executable = mpif90
  }
}

Library mpich2
{ 
  path = @ROOT/SDK
  includes = (.)
  libpath = @ROOT/SDK/lib
}

Library tibercad
{
  # path relative to TIBERCADROOT,
  path = @ROOT/SDK
  includes = (
    tibercad/base/common,
    tibercad/base/atomistic,
    tibercad/base/database,
    tibercad/base/io,
    tibercad/base/math,
    tibercad/base/simulations,
    tibercad/pmi,
    tibercad/core/models,
    tibercad/core/tightbinding,
    tibercad/core/semiconductormodels,
    tibercad/core/macrostrain,
    tibercad/core/embracing,
    tibercad/core/solver-interfaces,
    tibercad/core/solver-interfaces/petsc,
    tibercad/core/quantumEFAmodels,
    tibercad/core/optics,
    tibercad/core/kintegrations,
    tibercad/core/eigenvalue,
    tibercad/utils/Tensor,
    tibercad/utils/SLEPC,
    tibercad/@ARCH
  )
  libpath = @ARCH/lib
  linker_flags = -ltibercad
}


Library boost
{
  includes = SDK/include
}


Library libmesh
{
  path = @ROOT/SDK
  includes = (., libmesh, libmesh/@ARCH, ../contrib/eigen/eigen)
  libpath = @ROOT/SDK/@ARCH/lib
  linker_flags = -lmesh
}


Library petsc
{ 
  path = @ROOT/SDK
  includes = (petsc-3.6.2, petsc-3.6.2/@ARCH)
  libpath = @ROOT/SDK/@ARCH/lib
  linker_flags = -lpetsc_real
}

Library slepc
{
  path = @ROOT/SDK
  includes = (slepc-3.6.2, slepc-3.6.2/@ARCH)
  libpath = @ROOT/SDK/@ARCH/lib
  linker_flags = -lslepc_real
}

		
