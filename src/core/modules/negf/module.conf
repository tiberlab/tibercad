Module negf
{

  sources = (Negf.C, NegfModel.C)
  
  

  Dependency libnegf
  {
    includes = libnegf
    libraries = negf             # -> -lmylib
    libpath = libnegf           # -> -L/path/to/lib
    install = true
    #installpath = @ARCH/modules/@MODULE
  }

  
  hamiltonian single_band { sources = models/SingleBand.C }
  hamiltonian etb { sources = models/EtbModel.C }
  hamiltonian efa { sources = models/EfaModel.C }


}

